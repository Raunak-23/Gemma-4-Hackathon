agent_class: LlmAgent
name: sample_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: "Sample official baseline software engineering agent."
instruction: !include prompts/system.md
tools:
  - run_command
  - read_file
  - edit_file
  - write_file
  - get_status
  - submit_patch
  - search_similar_code
  - get_code_neighbors
  - get_code_subgraph
